<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#137548">
<title>L&A Fruver — Ingresar</title>
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="apple-touch-icon" href="img/favicon-180.png">
<link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="fr-login">
<main class="fr-login-wrap">
  <a class="fr-login-volver" href="index.html"><i class="bi bi-arrow-left" aria-hidden="true"></i> Volver al inicio</a>

  <section class="fr-login-card">
    <img class="fr-logo fr-logo-login mb-4" src="img/logo-login.png" width="220" height="118"
         alt="Fruver L&A — Calidad y Servicio">

    <div class="fr-etiqueta">Panel privado</div>
    <h1>Bienvenida</h1>
    <p class="fr-login-sub">Ingresa para gestionar pedidos, precios y clientes.</p>

    <!-- Mensajes de error o éxito: los muestra js/login.js -->
    <div id="msg" class="alert d-none" role="alert"></div>

    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label class="form-label" for="email">Correo electrónico</label>
        <input class="form-control" type="email" id="email" autocomplete="username" inputmode="email"
               placeholder="correo@ejemplo.com" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Contraseña</label>
        <div class="fr-campo-clave">
          <input class="form-control" type="password" id="password" autocomplete="current-password"
                 placeholder="Tu contraseña" required>
          <button type="button" class="fr-btn-ver" id="togglePass" aria-label="Mostrar u ocultar contraseña">
            <i class="bi bi-eye" aria-hidden="true"></i><span>Mostrar</span>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2 mt-1" id="btnIngresar">
        <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i> <span>Ingresar</span>
      </button>
    </form>

    <p class="fr-login-pie mb-0">L&A Fruver · Calidad y Servicio</p>
  </section>

  <!-- Versión, build y ambiente: lo llena js/login.js con /api/version -->
  <div class="fr-version" id="infoVersion"></div>
</main>

<script src="js/login.js"></script>
</body>
</html>

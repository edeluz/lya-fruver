<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#137548">
<title>L&A Fruver</title>
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="apple-touch-icon" href="img/favicon-180.png">
<link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="fr-login">
<main class="fr-login-wrap">
  <section class="fr-login-card text-center">
    <img class="fr-logo fr-logo-login mb-3" src="img/logo-login.png" width="220" height="118"
         alt="Fruver L&A — Calidad y Servicio">
    <h1 class="mb-1">Bienvenido</h1>
    <p class="fr-login-sub">¿Qué quieres hacer hoy?</p>

    <a class="fr-opcion" href="cliente.html">
      <span class="fr-opcion-icono"><i class="bi bi-basket" aria-hidden="true"></i></span>
      <span class="fr-opcion-texto">
        <strong>Hacer un pedido</strong>
        <small>Para clientes: elige tus productos y envía tu pedido.</small>
      </span>
      <i class="bi bi-chevron-right fr-opcion-flecha" aria-hidden="true"></i>
    </a>

    <a class="fr-opcion" href="admin.html">
      <span class="fr-opcion-icono fr-opcion-icono-amarillo"><i class="bi bi-clipboard-data" aria-hidden="true"></i></span>
      <span class="fr-opcion-texto">
        <strong>Panel de administración</strong>
        <small>Para la dueña: gestiona pedidos, catálogo y reportes.</small>
      </span>
      <i class="bi bi-chevron-right fr-opcion-flecha" aria-hidden="true"></i>
    </a>

    <p class="fr-login-pie mb-0">L&A Fruver · Calidad y Servicio</p>
  </section>
</main>
</body>
</html>
